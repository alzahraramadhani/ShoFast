name: Backend CI (FastAPI & Docker)

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "ci/**"
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Python Lint (Ruff) & Unit Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if backend directory is initialized
        id: check_backend
        run: |
          if [ -f "backend/requirements.txt" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Skipping backend tests: backend/requirements.txt not created yet."
          fi

      - name: Set up Python 3.11
        if: steps.check_backend.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install FFmpeg & Python dependencies
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Run Ruff linter
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        run: ruff check app tests || ruff check .

      - name: Run Pytest suite
        if: steps.check_backend.outputs.exists == 'true'
        working-directory: backend
        env:
          APP_ENV: test
          API_SECRET_KEY: ci-test-secret-key
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-key
          GEMINI_API_KEY: ci-dummy-gemini-key
        run: |
          if [ -d "tests" ]; then
            pytest -v --tb=short
          else
            echo "No tests directory yet; checking Python syntax compile."
            python -m compileall app
          fi

  docker-build-check:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: check_docker
        run: |
          if [ -f "backend/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image (CI check)
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: shofast-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
