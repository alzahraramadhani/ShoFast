name: CD Release (Docker GHCR & GitHub Release APK)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write
  packages: write

jobs:
  build-backend-image:
    name: Build & Push Backend Docker Image (GHCR)
    runs-on: ubuntu-latest
    outputs:
      image_published: ${{ steps.check_docker.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if backend Dockerfile exists
        id: check_docker
        run: |
          if [ -f "backend/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set lowercase repository owner for GHCR
        if: steps.check_docker.outputs.exists == 'true'
        id: repo_meta
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.check_docker.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_meta.outputs.owner_lc }}/shofast-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Backend Docker image
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-android-apk:
    name: Build Android APK for Release
    runs-on: ubuntu-latest
    outputs:
      apk_built: ${{ steps.check_android.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if Android project exists
        id: check_android
        run: |
          if [ -f "android/gradlew" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check_android.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        if: steps.check_android.outputs.exists == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        if: steps.check_android.outputs.exists == 'true'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK for Release job
        if: steps.check_android.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: android/app/build/outputs/apk/debug/*.apk

  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-backend-image, build-android-apk]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download APK artifact if built
        if: needs.build-android-apk.outputs.apk_built == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./release-assets

      - name: Determine release tag
        id: tag
        run: |
          mkdir -p ./release-assets
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "ShoFast ${{ steps.tag.outputs.name }}"
          generate_release_notes: true
          files: |
            ./release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
