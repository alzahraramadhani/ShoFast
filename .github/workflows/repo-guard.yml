name: Repo Guard & Commit Policy

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "ci/**"
      - "refactor/**"
      - "style/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repo-hygiene:
    name: Secret, File & YAML Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required root documentation & repo files
        run: |
          for file in README.md AGENTS.md LICENSE .gitignore .gitattributes CONTRIBUTING.md; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing required file: $file"
              exit 1
            fi
          done
          echo "All required root files are present."

      - name: Scan tracked files for forbidden secrets or media binaries
        run: |
          python3 - <<'EOF'
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_patterns = [
              r"(^|/)\.env$",
              r"(^|/)\.env\.(?!example$).+",
              r"\.(jks|keystore|p12|pfx|pem|key)$",
              r"(^|/)local\.properties$",
              r"\.(mp4|mkv|mov|avi|webm|apk|aab)$",
          ]

          violations = []
          for path in tracked:
              for pat in forbidden_patterns:
                  if re.search(pat, path, re.IGNORECASE):
                      violations.append(path)
                      break
              if path.lower().endswith(".csv") and not path.startswith("Docs/"):
                  violations.append(path)

          if violations:
              print("ERROR: Forbidden files tracked in Git:")
              for v in violations:
                  print(f"  - {v}")
              sys.exit(1)

          print(f"Scanned {len(tracked)} tracked files: no forbidden files found.")
          EOF

      - name: Validate GitHub Actions workflow YAML syntax
        run: |
          if ! python3 -c "import yaml" 2>/dev/null; then
            python3 -m pip install --quiet pyyaml
          fi
          python3 - <<'EOF'
          import glob
          import yaml

          for path in sorted(glob.glob(".github/**/*.yml", recursive=True)):
              with open(path, "r", encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"Valid YAML: {path}")
          EOF

  conventional-commits:
    name: Conventional Commits Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit message format
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          import subprocess
          import sys

          pattern = re.compile(
              r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .{3,}$"
          )
          merge_or_revert = re.compile(r"^(Merge |Revert \")")

          event_name = os.environ["EVENT_NAME"]
          if event_name == "pull_request":
              rev_range = f"{os.environ['PR_BASE_SHA']}..{os.environ['PR_HEAD_SHA']}"
          else:
              before = os.environ["BEFORE_SHA"]
              head = os.environ["HEAD_SHA"]
              if not before or before == "0" * 40:
                  rev_range = head
              else:
                  rev_range = f"{before}..{head}"

          raw = subprocess.check_output(
              ["git", "log", "--format=%H%x1f%s", rev_range],
              text=True,
          ).strip()

          if not raw:
              print("No commits to validate.")
              sys.exit(0)

          invalid = []
          lines = raw.splitlines()
          for line in lines:
              sha, subject = line.split("\x1f", 1)
              if pattern.match(subject) or merge_or_revert.match(subject):
                  print(f"PASS  {sha[:7]}: {subject}")
              else:
                  print(f"FAIL  {sha[:7]}: {subject}")
                  invalid.append((sha[:7], subject))

          if invalid:
              print("\nERROR: Commit message must follow Conventional Commits format:")
              print("  <type>(<scope>): <subject>")
              print("  Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert")
              sys.exit(1)
          EOF
